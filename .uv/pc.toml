# UV configuration for PC (Linux/Windows)
[tool.uv]
python = "3.11"

# PC specific settings
[tool.uv.pip]
# Use standard PyPI for PC
index-url = "https://pypi.org/simple"

# Environment variables for PC
[tool.uv.env]
PLATFORM = "pc"
TENSORFLOW_PACKAGE = "tensorflow"

# Override dependencies for PC-specific versions
[tool.uv.override-dependencies]
tensorflow = "tensorflow==2.15.*"
opencv-python = "opencv-python"