# UV configuration for macOS
[tool.uv]
python = "3.11"

# macOS specific settings
[tool.uv.pip]
# Use standard PyPI for macOS
index-url = "https://pypi.org/simple"

# Environment variables for macOS
[tool.uv.env]
PLATFORM = "macos"
ARCHITECTURE = "arm64"  # or x86_64 depending on Mac
TENSORFLOW_PACKAGE = "tensorflow-macos"

# Override dependencies for macOS-specific versions
[tool.uv.override-dependencies]
tensorflow = "tensorflow-macos==2.15.*"
opencv-python = "opencv-python"

# macOS Metal acceleration for TensorFlow
[tool.uv.env.macos]
TF_CPP_MIN_LOG_LEVEL = "2"
TF_METAL = "1"