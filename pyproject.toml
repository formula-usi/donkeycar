[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "donkeycar"
dynamic = ["version"]
description = "Self driving library for python."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "MIT"
authors = [
    {name = "Will Roscoe"},
    {name = "Adam Conway"},
    {name = "Tawn Kramer"},
]
keywords = ["selfdriving", "cars", "donkeycar", "diyrobocars"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]

# Core dependencies that work across all platforms
dependencies = [
    "numpy",
    "pillow",
    "docopt",
    "tornado",
    "requests",
    "PrettyTable",
    "paho-mqtt",
    "simple_pid",
    "progress",
    "pyfiglet",
    "psutil",
    "pynmea2",
    "pyserial",
    "utm",
    "pandas",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/autorope/donkeycar"
Repository = "https://github.com/autorope/donkeycar"
Issues = "https://github.com/autorope/donkeycar/issues"

[project.scripts]
donkey = "donkeycar.management.base:execute_from_command_line"

[project.optional-dependencies]

# Raspberry Pi specific dependencies
pi = [
    "picamera2",
    "Adafruit_PCA9685",
    "adafruit-circuitpython-ssd1306",
    "adafruit-circuitpython-rplidar",
    "RPi.GPIO",
    "tensorflow-aarch64==2.15.*",
    "opencv-contrib-python",
]

# Jetson Nano specific dependencies
nano = [
    "Adafruit_PCA9685",
    "adafruit-circuitpython-ssd1306",
    "adafruit-circuitpython-rplidar",
    "Jetson.GPIO",
    "numpy==1.23.*",
    "matplotlib==3.7.*",
    "kivy",
    "plotly",
    "pandas==2.0.*",
]

# PC (Linux/Windows) specific dependencies
pc = [
    "tensorflow[and-cuda]==2.15.*",
    "matplotlib",
    "kivy",
    "pandas",
    "plotly",
    "albumentations==1.3.1",
    "numpy<2",
    "opencv-python",
]

# Nvidia GPU Container specific dependencies
ngc = [
    "matplotlib",
    "kivy",
    "pandas",
    "plotly",
    "albumentations==1.3.1",
    "numpy<2",
    "opencv-python",
]

# macOS specific dependencies
macos = [
    "tensorflow-macos==2.15.*",
    "matplotlib",
    "kivy",
    "pandas",
    "plotly",
    "albumentations",
    "opencv-python",
    "gym==0.22.0",
]

# DGX / Spark-like environments
spark = [
    "tensorflow==2.15.*",
    "numpy<2",
    "opencv-python",
]

# Gym Donkey Car simulator dependencies (installed separately)
"gym-donkeycar" = [
    "gym==0.22.0",
    "gym-donkeycar"
]

# Development dependencies
dev = [
    "pytest",
    "pytest-cov",
    "responses",
    "mypy",
    "black",
    "isort",
    "flake8",
]

# PyTorch dependencies (cross-platform)
torch = [
    "torch==2.1.*",
    "pytorch-lightning",
    "torchvision",
    "torchaudio",
    "fastai",
]

[tool.setuptools]
packages = ["donkeycar"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "donkeycar.__version__"}

[tool.setuptools.package-data]
"*" = ["*.html", "*.ini", "*.txt", "*.kv"]

# UV-specific configuration
[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "responses",
    "mypy",
    "black",
    "isort",
    "flake8",
]